<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyBridge — Поступи в топовый университет</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: { fontFamily: { sans: ["Inter","sans-serif"] }, animation: { "float":"float 3s ease-in-out infinite", "pulse-slow":"pulse 3s ease-in-out infinite", "slide-up":"slideUp 0.6s ease-out forwards" }, keyframes: { float:{"0%,100%":{transform:"translateY(0)"},"50%":{transform:"translateY(-8px)"}}, slideUp:{from:{opacity:0,transform:"translateY(30px)"},to:{opacity:1,transform:"translateY(0)"}} } } }
    }
  </script>
  <style>
    body{font-family:"Inter",sans-serif;}
    .gradient-text{background:linear-gradient(135deg,#4f46e5,#9333ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .gradient-bg{background:linear-gradient(135deg,#4f46e5 0%,#7e22ce 100%);}
    .card-hover{transition:all 0.3s cubic-bezier(.4,0,.2,1);}
    .card-hover:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(79,70,229,.15);}
    .btn-primary{background:linear-gradient(135deg,#4f46e5,#7e22ce);transition:all 0.3s;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(79,70,229,.4);}
    ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:#f1f5f9;}::-webkit-scrollbar-thumb{background:#6366f1;border-radius:3px;}
  </style>
</head>
<body>
<div id="root"></div>
<script src="app.jsx" type="text/babel"></script>
</body>
</html>
