<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyBridge — Поступи в топовый университет</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
              300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
              600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81'
            },
            purple: {
              50: '#faf5ff', 100: '#f3e8ff', 200: '#e9d5ff',
              300: '#d8b4fe', 400: '#c084fc', 500: '#a855f7',
              600: '#9333ea', 700: '#7e22ce', 800: '#6b21a8', 900: '#581c87'
            }
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
            'slide-up': 'slideUp 0.6s ease-out forwards',
            'fade-in': 'fadeIn 0.8s ease-out forwards',
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } },
            slideUp: { from: { opacity: 0, transform: 'translateY(30px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
            fadeIn: { from: { opacity: 0 }, to: { opacity: 1 } },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #4f46e5, #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #7e22ce 100%); }
    .glass { backdrop-filter: blur(12px); background: rgba(255,255,255,0.7); }
    .dark .glass { background: rgba(15,15,30,0.7); }
    .card-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(79,70,229,0.15); }
    .btn-primary { background: linear-gradient(135deg, #4f46e5, #7e22ce); transition: all 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79,70,229,0.4); }
    .progress-bar { transition: width 1.5s cubic-bezier(0.4,0,0.2,1); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 3px; }
    .dark ::-webkit-scrollbar-track { background: #1e1b4b; }
    .timeline-line::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: linear-gradient(to bottom, #4f46e5, #9333ea); transform: translateX(-50%); }
    @media (max-width: 768px) { .timeline-line::before { left: 20px; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── ICONS ─────────────────────────────────────────────────────────────────────
const Icon = ({ name, cls = "w-5 h-5" }) => {

    sun: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" strokeWidth="2" strokeLinecap="round"/></svg>,
    moon: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    star: <svg className={cls} fill="currentColor" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>,
    check: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    arrow: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" strokeWidth="2" strokeLinecap="round"/><polyline points="12,5 19,12 12,19" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    x: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18" strokeWidth="2" strokeLinecap="round"/><line x1="6" y1="6" x2="18" y2="18" strokeWidth="2" strokeLinecap="round"/></svg>,
    brain: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2z" strokeWidth="1.5"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2z" strokeWidth="1.5"/></svg>,
    zap: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10" strokeWidth="2" strokeLinejoin="round"/></svg>,
    target: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" strokeWidth="2"/><circle cx="12" cy="12" r="6" strokeWidth="2"/><circle cx="12" cy="12" r="2" strokeWidth="2"/></svg>,
    chart: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    users: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" strokeWidth="2"/><circle cx="9" cy="7" r="4" strokeWidth="2"/><path d="M23 21v-2a4 4 0 0 0-3-3.87" strokeWidth="2"/><path d="M16 3.13a4 4 0 0 1 0 7.75" strokeWidth="2"/></svg>,
    book: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" strokeWidth="2"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" strokeWidth="2"/></svg>,
    fire: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" strokeWidth="2"/></svg>,
    trophy: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" strokeWidth="2"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" strokeWidth="2"/><path d="M4 22h16" strokeWidth="2" strokeLinecap="round"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" strokeWidth="2"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" strokeWidth="2"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z" strokeWidth="2"/></svg>,
    calendar: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" strokeWidth="2"/><line x1="16" y1="2" x2="16" y2="6" strokeWidth="2" strokeLinecap="round"/><line x1="8" y1="2" x2="8" y2="6" strokeWidth="2" strokeLinecap="round"/><line x1="3" y1="10" x2="21" y2="10" strokeWidth="2"/></svg>,
    lock: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" strokeWidth="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" strokeWidth="2"/></svg>,
    menu: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12" strokeWidth="2" strokeLinecap="round"/><line x1="3" y1="6" x2="21" y2="6" strokeWidth="2" strokeLinecap="round"/><line x1="3" y1="18" x2="21" y2="18" strokeWidth="2" strokeLinecap="round"/></svg>,
    play: <svg className={cls} fill="currentColor" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>,
    award: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6" strokeWidth="2"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" strokeWidth="2"/></svg>,
    map: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="1,6 1,22 8,18 16,22 23,18 23,2 16,6 8,2" strokeWidth="2" strokeLinejoin="round"/><line x1="8" y1="2" x2="8" y2="18" strokeWidth="2"/><line x1="16" y1="6" x2="16" y2="22" strokeWidth="2"/></svg>,
    msg: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" strokeWidth="2"/></svg>,
    credit: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2" strokeWidth="2"/><line x1="1" y1="10" x2="23" y2="10" strokeWidth="2"/></svg>,
    home: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" strokeWidth="2"/><polyline points="9,22 9,12 15,12 15,22" strokeWidth="2"/></svg>,
    person: <svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" strokeWidth="2"/><circle cx="12" cy="7" r="4" strokeWidth="2"/></svg>,
  };
  return icons[name] || null;
};

// ── NAVBAR ────────────────────────────────────────────────────────────────────
const Navbar = ({ dark, setDark, setPage, setModal }) => {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'shadow-lg' : ''} ${dark ? 'bg-gray-950/90' : 'bg-white/90'} backdrop-blur-md border-b ${dark ? 'border-gray-800' : 'border-gray-100'}`}>
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex items-center justify-between h-16">
          <button onClick={() => setPage('home')} className="flex items-center gap-2 group">
            <div className="w-8 h-8 gradient-bg rounded-lg flex items-center justify-center shadow-md group-hover:shadow-lg transition-all">
              <span className="text-white font-black text-sm">SB</span>
            </div>
            <span className={`font-bold text-xl ${dark ? 'text-white' : 'text-gray-900'}`}>StudyBridge</span>
          </button>

          <div className="hidden md:flex items-center gap-8">
            {[['О платформе','#about'],['Как работает','#how'],['Цены','#pricing'],['Отзывы','#reviews']].map(([label, href]) => (
              <a key={href} href={href} className={`text-sm font-medium transition-colors ${dark ? 'text-gray-300 hover:text-white' : 'text-gray-600 hover:text-gray-900'}`}>{label}</a>
            ))}
          </div>

          <div className="flex items-center gap-3">
            <button onClick={() => setDark(!dark)} className={`p-2 rounded-lg transition-colors ${dark ? 'bg-gray-800 text-yellow-400 hover:bg-gray-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
              <Icon name={dark ? 'sun' : 'moon'} cls="w-4 h-4" />
            </button>
            <button onClick={() => setModal('login')} className={`hidden md:block text-sm font-medium px-4 py-2 rounded-lg transition-colors ${dark ? 'text-gray-300 hover:text-white hover:bg-gray-800' : 'text-gray-700 hover:bg-gray-100'}`}>
              Войти
            </button>
            <button onClick={() => setModal('signup')} className="btn-primary text-white text-sm font-semibold px-4 py-2 rounded-lg">
              Начать бесплатно
            </button>
            <button className="md:hidden p-2" onClick={() => setMobileOpen(!mobileOpen)}>
              <Icon name="menu" cls="w-5 h-5" />
            </button>
          </div>
        </div>
      </div>
      {mobileOpen && (
        <div className={`md:hidden border-t ${dark ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-100'} px-4 py-4 flex flex-col gap-3`}>
          {[['О платформе','#about'],['Как работает','#how'],['Цены','#pricing'],['Отзывы','#reviews']].map(([label, href]) => (
            <a key={href} href={href} onClick={() => setMobileOpen(false)} className={`text-sm font-medium py-2 ${dark ? 'text-gray-300' : 'text-gray-700'}`}>{label}</a>
          ))}
          <button onClick={() => { setModal('login'); setMobileOpen(false); }} className={`text-sm font-medium py-2 text-left ${dark ? 'text-gray-300' : 'text-gray-700'}`}>Войти</button>
        </div>
      )}
    </nav>
  );
};

// ── HERO ──────────────────────────────────────────────────────────────────────
const Hero = ({ dark, setModal, setPage }) => {
  const [progress, setProgress] = useState(0);
  useEffect(() => { const t = setTimeout(() => setProgress(72), 500); return () => clearTimeout(t); }, []);
  return (
    <section className={`min-h-screen pt-16 flex items-center relative overflow-hidden ${dark ? 'bg-gray-950' : 'bg-gradient-to-br from-slate-50 via-blue-50/30 to-purple-50/40'}`}>
      <div className="absolute inset-0 overflow-hidden pointer-events-none">
        <div className="absolute -top-40 -right-40 w-96 h-96 bg-brand-500/10 rounded-full blur-3xl animate-pulse-slow" />
        <div className="absolute -bottom-40 -left-40 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl animate-pulse-slow" style={{animationDelay:'1.5s'}} />
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-brand-400/5 rounded-full blur-3xl" />
      </div>

      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 w-full">
        <div className="grid lg:grid-cols-2 gap-16 items-center">
          <div className="space-y-8 animate-slide-up">
            <div className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold ${dark ? 'bg-brand-900/50 text-brand-300 border border-brand-800' : 'bg-brand-50 text-brand-700 border border-brand-200'}`}>
              <span className="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse" />
              Более 3 000 учеников уже поступили
            </div>
            <h1 className={`text-4xl sm:text-5xl lg:text-6xl font-extrabold leading-[1.1] ${dark ? 'text-white' : 'text-gray-900'}`}>
              Перейди от бесплатных вебинаров к{' '}
              <span className="gradient-text">реальному результату</span>
            </h1>
            <p className={`text-lg sm:text-xl leading-relaxed ${dark ? 'text-gray-400' : 'text-gray-600'}`}>
              StudyBridge помогает школьникам поступать в топовые университеты и выигрывать олимпиады с персональным обучением.
            </p>
            <div className="flex flex-col sm:flex-row gap-4">
              <button onClick={() => setModal('signup')} className="btn-primary text-white font-semibold px-8 py-4 rounded-xl text-base flex items-center justify-center gap-2 shadow-lg">
                Попробовать бесплатно
                <Icon name="arrow" cls="w-4 h-4" />
              </button>
              <button onClick={() => setPage('dashboard')} className={`font-semibold px-8 py-4 rounded-xl text-base flex items-center justify-center gap-2 border-2 transition-all hover:shadow-md ${dark ? 'border-gray-700 text-gray-300 hover:border-brand-500 hover:text-brand-400' : 'border-gray-200 text-gray-700 hover:border-brand-400 hover:text-brand-600'}`}>
                <Icon name="play" cls="w-4 h-4" />
                Посмотреть результаты учеников
              </button>
            </div>
            <div className={`flex gap-8 pt-2 ${dark ? 'text-gray-400' : 'text-gray-500'}`}>
              {[['3 000+','учеников'],['87%','поступают'],['4.9★','рейтинг']].map(([n,l]) => (
                <div key={l} className="text-center">
                  <div className={`text-2xl font-bold gradient-text`}>{n}</div>
                  <div className="text-xs">{l}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Dashboard mockup */}
          <div className="relative animate-float hidden lg:block">
            <div className={`rounded-2xl shadow-2xl border overflow-hidden ${dark ? 'bg-gray-900 border-gray-800' : 'bg-white border-gray-200'}`}>
              {/* Window bar */}
              <div className={`flex items-center gap-2 px-4 py-3 border-b ${dark ? 'border-gray-800 bg-gray-900' : 'border-gray-100 bg-gray-50'}`}>
                <div className="w-3 h-3 rounded-full bg-red-400" />
                <div className="w-3 h-3 rounded-full bg-yellow-400" />
                <div className="w-3 h-3 rounded-full bg-green-400" />
                <div className={`ml-4 text-xs ${dark ? 'text-gray-500' : 'text-gray-400'}`}>studybridge.io/dashboard</div>
              </div>
              <div className="p-5 space-y-4">
                {/* User row */}
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full gradient-bg flex items-center justify-center text-white font-bold text-sm">АМ</div>
                    <div>
                      <div className={`font-semibold text-sm ${dark ? 'text-white' : 'text-gray-900'}`}>Алина Морозова</div>
                      <div className="text-xs text-gray-500">ЕГЭ Математика · Профиль</div>
                    </div>
                  </div>
                  <div className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold ${dark ? 'bg-orange-900/40 text-orange-400' : 'bg-orange-50 text-orange-600'}`}>
                    <Icon name="fire" cls="w-3.5 h-3.5" /> 14 дней
                  </div>
                </div>
                {/* Progress */}
                <div className={`rounded-xl p-4 ${dark ? 'bg-gray-800' : 'bg-gray-50'}`}>
                  <div className="flex justify-between items-center mb-2">
                    <span className={`text-xs font-medium ${dark ? 'text-gray-400' : 'text-gray-600'}`}>Прогресс подготовки</span>
                    <span className="text-xs font-bold text-brand-600">{progress}%</span>
                  </div>
                  <div className={`h-2.5 rounded-full ${dark ? 'bg-gray-700' : 'bg-gray-200'}`}>
                    <div className="h-full rounded-full gradient-bg progress-bar" style={{width:`${progress}%`}} />
                  </div>
                  <div className="flex justify-between mt-2 text-xs text-gray-500">
                    <span>Алгебра ✓</span><span>Геометрия</span><span>Стереометрия</span>
                  </div>
                </div>
                {/* Stats row */}
                <div className="grid grid-cols-3 gap-3">
                  {[['🎯','Цель','25 июня'],['✅','Задач','147'],['🏆','Рейтинг','#12']].map(([e,l,v]) => (
                    <div key={l} className={`rounded-xl p-3 text-center ${dark ? 'bg-gray-800' : 'bg-blue-50'}`}>
                      <div className="text-lg">{e}</div>
                      <div className={`text-xs ${dark ? 'text-gray-500' : 'text-gray-500'}`}>{l}</div>
                      <div className={`text-sm font-bold ${dark ? 'text-white' : 'text-gray-800'}`}>{v}</div>
                    </div>
                  ))}
                </div>
                {/* Today tasks */}
                <div>
                  <div className={`text-xs font-semibold mb-2 ${dark ? 'text-gray-400' : 'text-gray-500'}`}>ЗАДАЧИ НА СЕГОДНЯ</div>
                  {[['Тригонометрия: тест 12 задач', true],['Разбор пробника с ментором', false],['Теория вероятностей: урок', false]].map(([t, done]) => (
                    <div key={t} className={`flex items-center gap-2.5 py-1.5 text-sm ${done ? 'opacity-60' : ''}`}>
                      <div className={`w-4 h-4 rounded flex items-center justify-center flex-shrink-0 ${done ? 'gradient-bg' : dark ? 'border-2 border-gray-700' : 'border-2 border-gray-300'}`}>
                        {done && <Icon name="check" cls="w-2.5 h-2.5 text-white" />}
                      </div>
                      <span className={`${done ? 'line-through' : ''} ${dark ? 'text-gray-300' : 'text-gray-700'}`}>{t}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            {/* Floating badges */}
            <div className={`absolute -top-4 -right-4 rounded-xl px-3 py-2 shadow-lg text-xs font-semibold flex items-center gap-2 ${dark ? 'bg-gray-800 text-green-400' : 'bg-white text-green-600'}`}>
              <span className="w-2 h-2 bg-green-400 rounded-full" /> ЕГЭ: 94 балла!
            </div>
            <div className={`absolute -bottom-4 -left-4 rounded-xl px-3 py-2 shadow-lg text-xs font-semibold ${dark ? 'bg-gray-800 text-brand-400' : 'bg-white text-brand-600'}`}>
              🎓 Поступила в МГУ
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

// ── WHY FREE ISN'T ENOUGH ─────────────────────────────────────────────────────

// ── APP ───────────────────────────────────────────────────────────────────────
const App = () => {
  const [dark, setDark] = useState(false);
  const [page, setPage] = useState('home');
  const [modal, setModal] = useState(null);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  const closeModal = () => setModal(null);

  return (
    <div className={dark ? 'dark' : ''}>
      <div className={dark ? 'text-white' : 'text-gray-900'}>
        <Navbar dark={dark} setDark={setDark} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} setModal={setModal} />

        {page === 'home' && (
          <>
            <Hero dark={dark} setModal={setModal} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} />
            <WhyFree dark={dark} />
            <SmartPath dark={dark} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} />
            <SocialProof dark={dark} />
            <FreemiumFlow dark={dark} setModal={setModal} />
            <Pricing dark={dark} setModal={setModal} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} />
            <FinalCTA setModal={setModal} />
            <Footer dark={dark} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} />
          </>
        )}
        {page === 'dashboard' && <DashboardPage dark={dark} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} />}
        {page === 'mentor' && <MentorPage dark={dark} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} setModal={setModal} />}
        {page === 'payment' && <PaymentPage dark={dark} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} />}

        {modal && <Modal type={modal} dark={dark} onClose={closeModal} setPage={(p) => { setPage(p); setModal(null); window.scrollTo(0,0); }} setModal={setModal} />}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
